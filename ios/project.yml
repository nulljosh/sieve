name: Siftbox
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202609111200"
targets:
  Siftbox:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.sieve
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Siftbox.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Siftbox-macOS.entitlements
  SiftboxTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Siftbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.sieve.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Siftbox.app/Contents/MacOS/Siftbox
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
schemes:
  Siftbox:
    build:
      targets:
        Siftbox: all
        SiftboxTests: [test]
    test:
      targets:
        - SiftboxTests
    run:
      config: Debug
    archive:
      config: Release
    shared: true
